
<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Tegemea | Executive, Project & Operational Support</title>
    <meta name="title" content="Tegemea | Executive, Project & Operational Support" />
    <meta name="description" content="Experienced UK-based Executive Assistants, Project Support professionals and Operational Coordinators — through flexible remote support or permanent recruitment." />
    <meta name="keywords" content="executive assistant UK, project support, operational coordinator, remote support, permanent recruitment, professional services UK" />
    <link rel="canonical" href="https://tegemea.co.uk" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tegemea.co.uk" />
    <meta property="og:title" content="Tegemea | Elite UK Virtual Assistant Support" />
    <meta property="og:description" content="Strategic operational support for leaders who value precision and trust. UK-based, London-vetted virtual assistants." />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://tegemea.co.uk" />
    <meta property="twitter:title" content="Tegemea | Elite UK Virtual Assistant Support" />
    <meta property="twitter:description" content="Strategic operational support for leaders who value precision and trust." />
    <meta property="twitter:image" content="/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                navy: '#0F172A',
                charcoal: '#1E293B',
                gold: '#C5A059',
                sand: '#F5F2ED',
                stone: '#71717A'
              }
            },
            fontFamily: {
              serif: ['Playfair Display', 'serif'],
              sans: ['Inter', 'sans-serif']
            }
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        background-color: #FDFCFB;
        color: #0F172A;
        margin: 0;
      }
      .fade-in {
        animation: fadeIn 1s ease-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-up {
        animation: fadeUp 0.9s ease-out both;
      }
      .fade-up-delay-1 { animation-delay: 0.12s; }
      .fade-up-delay-2 { animation-delay: 0.24s; }
      .fade-up-delay-3 { animation-delay: 0.36s; }
      .fade-up-delay-4 { animation-delay: 0.48s; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .image-reveal {
        animation: imageReveal 1.2s ease-out both;
      }
      @keyframes imageReveal {
        from { opacity: 0; transform: scale(1.04); }
        to { opacity: 1; transform: scale(1); }
      }
      .ken-burns {
        animation: kenBurns 18s ease-out forwards;
      }
      @keyframes kenBurns {
        from { transform: scale(1); }
        to { transform: scale(1.08); }
      }
      .stagger-in > * {
        opacity: 0;
        animation: fadeUp 0.7s ease-out forwards;
      }
      .stagger-in > *:nth-child(1) { animation-delay: 0.05s; }
      .stagger-in > *:nth-child(2) { animation-delay: 0.12s; }
      .stagger-in > *:nth-child(3) { animation-delay: 0.19s; }
      .stagger-in > *:nth-child(4) { animation-delay: 0.26s; }
      .stagger-in > *:nth-child(5) { animation-delay: 0.33s; }
      .stagger-in > *:nth-child(6) { animation-delay: 0.4s; }
      .panel-slide {
        animation: panelSlide 0.8s ease-out both;
      }
      @keyframes panelSlide {
        from { opacity: 0; transform: translateX(-16px); }
        to { opacity: 1; transform: translateX(0); }
      }
      .tab-crossfade {
        animation: tabCrossfade 0.35s ease-out;
      }
      @keyframes tabCrossfade {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .step-active {
        background-color: #0F172A !important;
        color: #fff !important;
      }
      .tools-marquee {
        overflow: hidden;
        white-space: nowrap;
      }
      .tools-marquee-track {
        display: inline-flex;
        align-items: center;
        gap: 3.5rem;
        animation: toolsMarquee 28s linear infinite;
        will-change: transform;
      }
      .tools-marquee:hover .tools-marquee-track {
        animation-play-state: paused;
      }
      @keyframes toolsMarquee {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
      .step-active h3,
      .step-active span {
        color: #fff !important;
      }
      .step-active p {
        color: rgba(255,255,255,0.6) !important;
      }
      #root {
        min-height: 100vh;
      }
      .selection\:bg-brand-gold\/20 ::selection {
        background-color: rgba(197, 160, 89, 0.2);
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
